<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- Left: normal state -->
  <text x="160" y="26" text-anchor="middle" font-size="14" fill="#333333" font-weight="600">Normal — HEAD points to a branch</text>

  <rect x="120" y="45" width="80" height="28" rx="14" fill="#d64550"/>
  <text x="160" y="64" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">HEAD</text>
  <line x1="160" y1="73" x2="160" y2="96" stroke="#d64550" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="120" y="100" width="80" height="28" rx="14" fill="#2f5fa8"/>
  <text x="160" y="119" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">payment</text>
  <line x1="160" y1="128" x2="160" y2="151" stroke="#2f5fa8" stroke-width="2" marker-end="url(#arrow4)"/>

  <circle cx="160" cy="185" r="28" fill="#eaf2ff" stroke="#2f5fa8" stroke-width="2.5"/>
  <text x="160" y="191" text-anchor="middle" font-size="14">C4</text>

  <text x="160" y="235" text-anchor="middle" font-size="11" fill="#666666">new commits move "payment";</text>
  <text x="160" y="250" text-anchor="middle" font-size="11" fill="#666666">HEAD stays put on the branch</text>

  <!-- divider -->
  <line x1="340" y1="20" x2="340" y2="250" stroke="#dddddd" stroke-width="1"/>

  <!-- Right: detached state -->
  <text x="510" y="26" text-anchor="middle" font-size="14" fill="#333333" font-weight="600">Detached HEAD — HEAD points to a commit</text>

  <rect x="470" y="45" width="80" height="28" rx="14" fill="#d64550"/>
  <text x="510" y="64" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">HEAD</text>
  <line x1="510" y1="73" x2="510" y2="151" stroke="#d64550" stroke-width="2" marker-end="url(#arrow4)"/>

  <circle cx="510" cy="185" r="28" fill="#fdeaea" stroke="#d64550" stroke-width="2.5"/>
  <text x="510" y="191" text-anchor="middle" font-size="14">C4</text>

  <text x="510" y="235" text-anchor="middle" font-size="11" fill="#666666">new commits move HEAD itself;</text>
  <text x="510" y="250" text-anchor="middle" font-size="11" fill="#666666">no branch is following along</text>
</svg>
