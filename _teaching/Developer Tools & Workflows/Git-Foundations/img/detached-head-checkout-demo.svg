<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- State A: before -->
  <text x="20" y="26" font-size="14" font-weight="600" fill="#334155">Before — HEAD attached to main</text>

  <!-- main label -->
  <rect x="188" y="44" width="64" height="24" rx="4" fill="#2563eb"/>
  <text x="220" y="60" text-anchor="middle" font-size="12" fill="white" font-weight="600">main</text>
  <line x1="220" y1="68" x2="220" y2="94" stroke="#2563eb" stroke-width="2"/>

  <circle cx="90" cy="130" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="90" y="135" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="600">C0</text>

  <circle cx="220" cy="130" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="220" y="135" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="600">C1</text>

  <line x1="194" y1="130" x2="146" y2="130" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- State B: after -->
  <text x="20" y="230" font-size="14" font-weight="600" fill="#334155">After — git checkout C1 (a commit, not a branch)</text>

  <!-- HEAD label -->
  <rect x="106" y="248" width="64" height="24" rx="4" fill="#dc2626"/>
  <text x="138" y="264" text-anchor="middle" font-size="12" fill="white" font-weight="600">HEAD</text>
  <line x1="138" y1="272" x2="180" y2="300" stroke="#dc2626" stroke-width="2"/>

  <!-- main label -->
  <rect x="264" y="248" width="64" height="24" rx="4" fill="#2563eb"/>
  <text x="296" y="264" text-anchor="middle" font-size="12" fill="white" font-weight="600">main</text>
  <line x1="296" y1="272" x2="256" y2="300" stroke="#2563eb" stroke-width="2"/>

  <circle cx="90" cy="330" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="90" y="335" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="600">C0</text>

  <circle cx="220" cy="330" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="220" y="335" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="600">C1</text>

  <line x1="194" y1="330" x2="146" y2="330" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Right side commands -->
  <rect x="400" y="105" width="330" height="46" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="416" y="134" font-size="13.5" fill="#0f172a" font-family="monospace">git checkout &lt;commit hash&gt;</text>

  <rect x="400" y="305" width="330" height="46" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="416" y="334" font-size="13.5" fill="#0f172a" font-family="monospace">git checkout C1</text>

  <line x1="400" y1="328" x2="330" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <text x="400" y="390" font-size="13" fill="#475569">commit — C1, not the branch "main"</text>
  <text x="400" y="410" font-size="13" fill="#475569">HEAD now points directly at C1,</text>
  <text x="400" y="428" font-size="13" fill="#475569">even though main also sits at C1.</text>
</svg>
