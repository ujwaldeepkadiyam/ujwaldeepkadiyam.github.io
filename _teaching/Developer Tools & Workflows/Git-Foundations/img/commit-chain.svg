<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- connecting lines between commits -->
  <line x1="140" y1="140" x2="290" y2="140" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="360" y1="140" x2="510" y2="140" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- commits -->
  <circle cx="110" cy="140" r="30" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="110" y="146" text-anchor="middle" font-size="16" fill="#222222">C0</text>

  <circle cx="325" cy="140" r="30" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="325" y="146" text-anchor="middle" font-size="16" fill="#222222">C1</text>

  <circle cx="540" cy="140" r="30" fill="#eaf2ff" stroke="#2f5fa8" stroke-width="2.5"/>
  <text x="540" y="146" text-anchor="middle" font-size="16" fill="#1c3a66">C2</text>

  <!-- main label + pointer -->
  <rect x="500" y="55" width="80" height="30" rx="15" fill="#2f5fa8"/>
  <text x="540" y="75" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">main</text>
  <line x1="540" y1="85" x2="540" y2="108" stroke="#2f5fa8" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- captions -->
  <text x="110" y="190" text-anchor="middle" font-size="12" fill="#666666">platform base</text>
  <text x="325" y="190" text-anchor="middle" font-size="12" fill="#666666">login feature</text>
  <text x="540" y="190" text-anchor="middle" font-size="12" fill="#666666">latest commit</text>
</svg>
