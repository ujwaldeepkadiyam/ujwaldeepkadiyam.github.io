<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowBlue3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <circle cx="90" cy="110" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="90" y="115" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="600">C0</text>

  <circle cx="270" cy="110" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="270" y="115" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="600">C1</text>

  <circle cx="450" cy="110" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="450" y="115" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="600">C2</text>

  <line x1="244" y1="110" x2="116" y2="110" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue3)"/>
  <line x1="424" y1="110" x2="296" y2="110" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue3)"/>

  <!-- reference labels below, each pointing up to its commit -->
  <line x1="90" y1="160" x2="90" y2="140" stroke="#2563eb" stroke-width="1.75"/>
  <rect x="46" y="162" width="88" height="26" rx="4" fill="#2563eb"/>
  <text x="90" y="180" text-anchor="middle" font-size="12.5" fill="white" font-weight="600">main^^</text>

  <line x1="270" y1="160" x2="270" y2="140" stroke="#2563eb" stroke-width="1.75"/>
  <rect x="230" y="162" width="80" height="26" rx="4" fill="#2563eb"/>
  <text x="270" y="180" text-anchor="middle" font-size="12.5" fill="white" font-weight="600">main^</text>

  <line x1="450" y1="160" x2="450" y2="140" stroke="#2563eb" stroke-width="1.75"/>
  <rect x="414" y="162" width="72" height="26" rx="4" fill="#2563eb"/>
  <text x="450" y="180" text-anchor="middle" font-size="12.5" fill="white" font-weight="600">main</text>

  <text x="320" y="230" text-anchor="middle" font-size="13" fill="#475569">Each additional caret steps one commit further back through the parent chain.</text>
</svg>
