<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#333333" font-weight="600">Fast-forward merge — main has not moved since bugFix branched</text>

  <line x1="60" y1="90" x2="130" y2="90" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowF)"/>
  <line x1="160" y1="90" x2="230" y2="90" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowF)"/>
  <line x1="260" y1="90" x2="330" y2="90" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrowF)"/>

  <circle cx="40" cy="90" r="22" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="40" y="95" text-anchor="middle" font-size="12">C0</text>
  <circle cx="145" cy="90" r="22" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="145" y="95" text-anchor="middle" font-size="12">C1</text>
  <circle cx="250" cy="90" r="22" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="250" y="95" text-anchor="middle" font-size="12">B1</text>
  <circle cx="355" cy="90" r="24" fill="#fdeaea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="355" y="96" text-anchor="middle" font-size="12">B2</text>

  <rect x="120" y="130" width="60" height="24" rx="12" fill="#2f5fa8"/>
  <text x="150" y="147" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">main</text>
  <line x1="150" y1="130" x2="147" y2="112" stroke="#2f5fa8" stroke-width="2" marker-end="url(#arrowF)"/>

  <rect x="320" y="130" width="80" height="24" rx="12" fill="#c0392b"/>
  <text x="360" y="147" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">bugFix</text>
  <line x1="360" y1="130" x2="357" y2="114" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowF)"/>

  <text x="600" y="95" text-anchor="middle" font-size="26" fill="#8a8a8a">→</text>

  <text x="320" y="200" text-anchor="middle" font-size="12" fill="#555">git merge bugFix while on main simply slides "main"</text>
  <text x="320" y="216" text-anchor="middle" font-size="12" fill="#555">forward to B2 — no new commit is created</text>
</svg>
