<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowBlue4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="14" font-weight="600" fill="#334155">Now — before "git checkout main^"</text>

  <circle cx="90" cy="90" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="90" y="95" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="600">C0</text>
  <circle cx="250" cy="90" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="250" y="95" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="600">C1</text>
  <circle cx="410" cy="90" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="410" y="95" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="600">C2</text>

  <line x1="226" y1="90" x2="114" y2="90" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue4)"/>
  <line x1="386" y1="90" x2="274" y2="90" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue4)"/>

  <line x1="410" y1="66" x2="410" y2="44" stroke="#334155" stroke-width="1.75"/>
  <rect x="360" y="16" width="100" height="26" rx="4" fill="#334155"/>
  <text x="410" y="34" text-anchor="middle" font-size="12" fill="white" font-weight="600">HEAD, main</text>

  <!-- Command in middle -->
  <rect x="220" y="150" width="240" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="240" y="175" font-size="14" fill="#0f172a" font-family="monospace">git checkout main^</text>

  <text x="20" y="240" font-size="14" font-weight="600" fill="#334155">After "git checkout main^" — HEAD detaches to C1</text>

  <!-- HEAD at C1 -->
  <rect x="210" y="258" width="80" height="24" rx="4" fill="#dc2626"/>
  <text x="250" y="274" text-anchor="middle" font-size="12" fill="white" font-weight="600">HEAD</text>
  <line x1="250" y1="282" x2="250" y2="306" stroke="#dc2626" stroke-width="2"/>

  <!-- main at C2 -->
  <rect x="376" y="258" width="68" height="24" rx="4" fill="#2563eb"/>
  <text x="410" y="274" text-anchor="middle" font-size="12" fill="white" font-weight="600">main</text>
  <line x1="410" y1="282" x2="410" y2="306" stroke="#2563eb" stroke-width="2"/>

  <circle cx="90" cy="340" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="90" y="345" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="600">C0</text>
  <circle cx="250" cy="340" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="250" y="345" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="600">C1</text>
  <circle cx="410" cy="340" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="410" y="345" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="600">C2</text>

  <line x1="226" y1="340" x2="114" y2="340" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue4)"/>
  <line x1="386" y1="340" x2="274" y2="340" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue4)"/>

  <text x="20" y="395" font-size="13" fill="#475569">main is unchanged at C2 — only HEAD moved.</text>
  <text x="20" y="413" font-size="13" fill="#475569">HEAD → C1, main → C2, and HEAD is detached.</text>
</svg>
