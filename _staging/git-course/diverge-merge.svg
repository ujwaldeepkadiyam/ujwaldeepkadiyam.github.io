<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- base chain -->
  <line x1="90" y1="150" x2="190" y2="150" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="220" y1="150" x2="300" y2="150" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- payment branch going up -->
  <line x1="320" y1="140" x2="410" y2="80" stroke="#c76a2c" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="440" y1="80" x2="520" y2="80" stroke="#c76a2c" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- main branch going down (bug fix) -->
  <line x1="320" y1="158" x2="520" y2="220" stroke="#2f5fa8" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- merge arrow (dashed) from C4 into C5 -->
  <line x1="540" y1="90" x2="565" y2="212" stroke="#4a4a4a" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow3)"/>

  <!-- commit nodes -->
  <circle cx="60" cy="150" r="26" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="60" y="156" text-anchor="middle" font-size="14">C0</text>

  <circle cx="205" cy="150" r="26" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="205" y="156" text-anchor="middle" font-size="14">C1</text>

  <circle cx="310" cy="150" r="26" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="310" y="156" text-anchor="middle" font-size="14">C2</text>

  <circle cx="425" cy="80" r="26" fill="#fbeee2" stroke="#c76a2c" stroke-width="2"/>
  <text x="425" y="86" text-anchor="middle" font-size="14">C3</text>

  <circle cx="535" cy="80" r="26" fill="#fbeee2" stroke="#c76a2c" stroke-width="2"/>
  <text x="535" y="86" text-anchor="middle" font-size="14">C4</text>

  <circle cx="580" cy="222" r="28" fill="#eaf2ff" stroke="#2f5fa8" stroke-width="2.5"/>
  <text x="580" y="228" text-anchor="middle" font-size="14">C5</text>

  <!-- branch labels -->
  <rect x="500" y="35" width="90" height="26" rx="13" fill="#c76a2c"/>
  <text x="545" y="53" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">payment</text>
  <line x1="545" y1="61" x2="537" y2="60" stroke="#c76a2c" stroke-width="0"/>

  <rect x="545" y="255" width="75" height="26" rx="13" fill="#2f5fa8"/>
  <text x="582" y="273" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">main</text>
  <line x1="582" y1="255" x2="580" y2="250" stroke="#2f5fa8" stroke-width="2"/>

  <!-- captions -->
  <text x="425" y="115" text-anchor="middle" font-size="11" fill="#888888">payment feature work</text>
  <text x="490" y="200" text-anchor="middle" font-size="11" fill="#888888">production bug fix</text>
  <text x="620" y="145" text-anchor="middle" font-size="11" fill="#666666">git merge</text>
  <text x="620" y="160" text-anchor="middle" font-size="11" fill="#666666">payment</text>
</svg>
