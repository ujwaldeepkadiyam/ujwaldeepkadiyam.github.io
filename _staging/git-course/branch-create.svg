<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <line x1="140" y1="140" x2="290" y2="140" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="360" y1="140" x2="510" y2="140" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow2)"/>

  <circle cx="110" cy="140" r="28" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="110" y="146" text-anchor="middle" font-size="15" fill="#222222">C0</text>

  <circle cx="325" cy="140" r="28" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="325" y="146" text-anchor="middle" font-size="15" fill="#222222">C1</text>

  <circle cx="540" cy="140" r="30" fill="#eaf2ff" stroke="#2f5fa8" stroke-width="2.5"/>
  <text x="540" y="146" text-anchor="middle" font-size="16" fill="#1c3a66">C2</text>

  <!-- main pointer -->
  <rect x="470" y="40" width="80" height="28" rx="14" fill="#2f5fa8"/>
  <text x="510" y="59" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">main</text>
  <line x1="510" y1="68" x2="530" y2="108" stroke="#2f5fa8" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- payment pointer -->
  <rect x="565" y="40" width="100" height="28" rx="14" fill="#c76a2c" transform="translate(-20,0)"/>
  <text x="595" y="59" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">payment</text>
  <line x1="595" y1="68" x2="552" y2="108" stroke="#c76a2c" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="540" y="195" text-anchor="middle" font-size="12" fill="#666666">git branch payment</text>
  <text x="540" y="212" text-anchor="middle" font-size="11" fill="#888888">both labels point to the same commit — no new commit, no files copied</text>
</svg>
